[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "1.0.0"
description = "Lean persistent graph memory MCP server for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kuzu>=0.7.0",
    "fastmcp>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
cortex = "brain.server:main"
cortex-server = "brain.server:main"
cortex-brain = "brain.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*"]
